steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "--build-arg",
        "NEXT_PUBLIC_API_URL=$_NEXT_PUBLIC_API_URL",
        "-t",
        "gcr.io/$PROJECT_ID/admin-dashboard",
        ".",
      ]
images:
  - "gcr.io/$PROJECT_ID/admin-dashboard"
substitutions:
  _NEXT_PUBLIC_API_URL: "https://session-api-1088865818405.us-central1.run.app"
