<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A634" />
      <stop offset="100%" stop-color="#F9D479" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feComposite in="coloredBlur" in2="SourceGraphic" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Premium Diamond Star Shape -->
  <path d="M256 32 L320 200 L 480 256 L 320 312 L 256 480 L 192 312 L 32 256 L 192 200 Z" 
        fill="url(#gold-grad)" 
        stroke="#E4B644" 
        stroke-width="4"
        filter="url(#glow)" />
        
  <!-- Inner Spark -->
  <path d="M256 160 L 280 256 L 352 256 L 280 256 L 256 352 L 232 256 L 160 256 L 232 256 Z" 
        fill="#FFFFFF" 
        opacity="0.8" />
</svg>
